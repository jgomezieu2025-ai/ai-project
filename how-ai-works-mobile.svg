<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 780" width="400" height="780" role="img" aria-labelledby="t d">
  <title id="t">How an AI system is trained and used</title>
  <desc id="d">Training: many examples go into a learning step that produces a model. Use: a question goes into the model, which makes a likely guess, and a person checks it.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#172033"/>
    </marker>
  </defs>
  <rect width="400" height="780" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#172033" text-anchor="middle">
    <text x="30" y="44" font-size="22" font-weight="700" text-anchor="start">1. Training</text>
    <text x="30" y="66" font-size="15" fill="#4a556b" text-anchor="start">happens once, costs a lot</text>

    <rect x="60" y="84" width="280" height="64" rx="12" fill="#eef2f6" stroke="#172033" stroke-width="2"/>
    <text x="200" y="123" font-size="18" font-weight="600">Huge set of examples</text>
    <line x1="200" y1="150" x2="200" y2="176" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="60" y="180" width="280" height="76" rx="12" fill="#eef2f6" stroke="#172033" stroke-width="2"/>
    <text x="200" y="212" font-size="18" font-weight="600">Learning step</text>
    <text x="200" y="236" font-size="15" fill="#4a556b">adjusts until guesses fit</text>
    <line x1="200" y1="258" x2="200" y2="284" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="60" y="288" width="280" height="64" rx="12" fill="#2b50e8"/>
    <text x="200" y="327" font-size="20" font-weight="700" fill="#ffffff">Model</text>

    <line x1="200" y1="354" x2="200" y2="398" stroke="#2b50e8" stroke-width="2.5" stroke-dasharray="6 5"/>

    <text x="30" y="430" font-size="22" font-weight="700" text-anchor="start">2. Use</text>
    <text x="30" y="452" font-size="15" fill="#4a556b" text-anchor="start">happens millions of times a day</text>

    <rect x="60" y="470" width="280" height="64" rx="12" fill="#eef2f6" stroke="#172033" stroke-width="2"/>
    <text x="200" y="509" font-size="18" font-weight="600">Your question</text>
    <line x1="200" y1="536" x2="200" y2="562" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="60" y="566" width="280" height="64" rx="12" fill="#2b50e8"/>
    <text x="200" y="605" font-size="18" font-weight="700" fill="#ffffff">Model makes a likely guess</text>
    <line x1="200" y1="632" x2="200" y2="658" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="60" y="662" width="280" height="76" rx="12" fill="#dcf2e7" stroke="#0f6a45" stroke-width="2.5"/>
    <path d="M84 700 l10 10 l20 -22" fill="none" stroke="#0f6a45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="707" font-size="19" font-weight="700" fill="#0f6a45">A person checks it</text>
  </g>
</svg>
