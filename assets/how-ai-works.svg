<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d">
  <title id="t">How an AI system is trained and used</title>
  <desc id="d">Training: many examples go into a learning step that produces a model. Use: a question goes into the model, which produces a prediction that a person checks before acting on it.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#172033"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#172033">
    <!-- Row labels -->
    <text x="40" y="58" font-size="20" font-weight="700">1. Training</text>
    <text x="40" y="78" font-size="14" fill="#4a556b">happens once, costs a lot of computing power</text>
    <text x="40" y="258" font-size="20" font-weight="700">2. Use</text>
    <text x="40" y="278" font-size="14" fill="#4a556b">happens millions of times a day</text>

    <!-- Training row -->
    <g>
      <rect x="40" y="100" width="200" height="90" rx="12" fill="#eef2f6" stroke="#172033" stroke-width="2"/>
      <rect x="58" y="116" width="34" height="24" rx="3" fill="#cfd7e3"/>
      <rect x="98" y="116" width="34" height="24" rx="3" fill="#cfd7e3"/>
      <rect x="138" y="116" width="34" height="24" rx="3" fill="#cfd7e3"/>
      <rect x="178" y="116" width="34" height="24" rx="3" fill="#cfd7e3"/>
      <text x="140" y="172" font-size="16" text-anchor="middle" font-weight="600">Huge set of examples</text>
    </g>
    <line x1="244" y1="145" x2="326" y2="145" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <g>
      <rect x="330" y="100" width="220" height="90" rx="12" fill="#eef2f6" stroke="#172033" stroke-width="2"/>
      <text x="440" y="138" font-size="16" text-anchor="middle" font-weight="600">Learning step</text>
      <text x="440" y="162" font-size="14" text-anchor="middle" fill="#4a556b">adjusts until guesses</text>
      <text x="440" y="180" font-size="14" text-anchor="middle" fill="#4a556b">match the patterns</text>
    </g>
    <line x1="554" y1="145" x2="636" y2="145" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <g>
      <rect x="640" y="100" width="200" height="90" rx="12" fill="#2b50e8"/>
      <text x="740" y="140" font-size="20" text-anchor="middle" font-weight="700" fill="#ffffff">Model</text>
      <text x="740" y="164" font-size="14" text-anchor="middle" fill="#e2e8fd">stored patterns</text>
    </g>

    <!-- Model carried down to use row -->
    <path d="M740 194 L740 228 L440 228 L440 296" fill="none" stroke="#2b50e8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>

    <!-- Use row -->
    <g>
      <rect x="40" y="300" width="200" height="90" rx="12" fill="#eef2f6" stroke="#172033" stroke-width="2"/>
      <text x="140" y="340" font-size="16" text-anchor="middle" font-weight="600">Your question</text>
      <text x="140" y="364" font-size="14" text-anchor="middle" fill="#4a556b">text, photo, data</text>
    </g>
    <line x1="244" y1="345" x2="326" y2="345" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <g>
      <rect x="330" y="300" width="220" height="90" rx="12" fill="#2b50e8"/>
      <text x="440" y="340" font-size="16" text-anchor="middle" font-weight="700" fill="#ffffff">Model makes</text>
      <text x="440" y="364" font-size="16" text-anchor="middle" font-weight="700" fill="#ffffff">a likely guess</text>
    </g>
    <line x1="554" y1="345" x2="636" y2="345" stroke="#172033" stroke-width="2.5" marker-end="url(#arr)"/>
    <g>
      <rect x="640" y="300" width="200" height="90" rx="12" fill="#dcf2e7" stroke="#0f6a45" stroke-width="2.5"/>
      <path d="M668 345 l10 10 l20 -22" fill="none" stroke="#0f6a45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="768" y="340" font-size="16" text-anchor="middle" font-weight="700" fill="#0f6a45">A person</text>
      <text x="768" y="364" font-size="16" text-anchor="middle" font-weight="700" fill="#0f6a45">checks it</text>
    </g>
  </g>
</svg>
