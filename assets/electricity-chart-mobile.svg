<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460" role="img" aria-labelledby="t d">
  <title id="t">Global data centre electricity use, 2024 and 2030</title>
  <desc id="d">About 415 terawatt-hours in 2024, projected around 945 terawatt-hours in 2030, roughly Japan's total electricity use today. Source: IEA, Energy and AI.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#2b50e8"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#5c78f0" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="400" height="460" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#172033" text-anchor="middle">
    <text x="24" y="42" font-size="21" font-weight="700" text-anchor="start">Data centres’ electricity use</text>
    <text x="24" y="66" font-size="15" fill="#4a556b" text-anchor="start">Worldwide, terawatt-hours per year</text>

    <!-- baseline y=380, 1000 TWh = 280px -->
    <line x1="40" y1="380" x2="360" y2="380" stroke="#172033" stroke-width="1.5"/>

    <rect x="80" y="264" width="100" height="116" rx="4" fill="#8a97ad"/>
    <text x="130" y="252" font-size="22" font-weight="700">≈ 415</text>
    <text x="130" y="406" font-size="18" font-weight="700">2024</text>

    <rect x="220" y="115" width="100" height="265" rx="4" fill="url(#hatch)"/>
    <text x="270" y="103" font-size="22" font-weight="700">≈ 945</text>
    <text x="270" y="406" font-size="18" font-weight="700">2030</text>
    <text x="270" y="426" font-size="14" fill="#4a556b">projected</text>

    <text x="24" y="450" font-size="13" fill="#4a556b" text-anchor="start">2030 ≈ Japan’s total use today. Source: IEA (2025).</text>
  </g>
</svg>
